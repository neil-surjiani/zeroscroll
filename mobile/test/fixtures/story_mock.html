<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroScroll Stories Mock Test Fixture</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000;
      color: #fff;
    }

    /* Story Tray Mock */
    div[data-testid="story-tray"] {
      display: flex;
      overflow-x: auto;
      padding: 12px 16px;
      gap: 16px;
      background: #111;
      border-bottom: 1px solid #222;
    }
    .story-bubble {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #fff;
      font-size: 11px;
    }
    .story-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #555;
      background: #333;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Algorithmic Home Feed Mock (MUST BE BLOCKED / HIDDEN) */
    article, [role="feed"] {
      padding: 16px;
      border-bottom: 1px solid #333;
      margin: 8px 0;
      background: #181818;
    }

    /* Story Viewer Mock */
    .story-viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .story-slide {
      width: 90%;
      height: 80%;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .story-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-profile-link {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }
    .story-reply-bar {
      position: absolute;
      bottom: 24px;
      left: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }
    .story-nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 16px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .story-nav-prev { left: 8px; }
    .story-nav-next { right: 8px; }
  </style>
</head>
<body>

  <!-- 1. Story Tray Component with 3 Items -->
  <div data-testid="story-tray" role="menu">
    <a class="story-bubble" href="/stories/user_alpha/1001/" id="story-tray-item-1">
      <div class="story-avatar">A</div>
      <span>user_alpha</span>
    </a>
    <a class="story-bubble" href="/stories/user_beta/2001/" id="story-tray-item-2">
      <div class="story-avatar">B</div>
      <span>user_beta</span>
    </a>
    <a class="story-bubble" href="/stories/user_gamma/3001/" id="story-tray-item-3">
      <div class="story-avatar">G</div>
      <span>user_gamma</span>
    </a>
  </div>

  <!-- 2. Algorithmic Home Feed Items (Testing fail-closed isolation) -->
  <div role="feed">
    <article id="mock-feed-post-1">
      <h3>Algorithmic Feed Post 1</h3>
      <p>This content must be hidden by ZeroScroll CSS and triggers fail-closed mode if detected.</p>
    </article>
    <article id="mock-feed-post-2">
      <h3>Algorithmic Feed Post 2</h3>
      <p>Another algorithmic distraction post.</p>
    </article>
  </div>

  <!-- 3. Mock Story Viewer (User Alpha Slide 1 of 2) -->
  <div class="story-viewer-container" id="story-viewer" data-current-user="user_alpha" data-current-id="1001">
    <div class="story-slide">
      <div class="story-header">
        <a class="user-profile-link" href="/user_alpha/">@user_alpha</a>
        <div class="more-menu-btn" role="button" aria-label="More options">•••</div>
      </div>

      <div class="story-content" id="slide-content">
        <h2>User Alpha - Slide 1 (Story #1001)</h2>
        <video id="story-video" width="280" height="360" playsinline autoplay>
          <source src="data:video/mp4;base64," type="video/mp4">
        </video>
      </div>

      <!-- Navigation buttons -->
      <button class="story-nav-btn story-nav-prev" id="btn-prev-segment" onclick="goToPrevSegment()">‹</button>
      <button class="story-nav-btn story-nav-next" id="btn-next-segment" onclick="goToNextSegment()">›</button>

      <!-- Reply affordance -->
      <div class="story-reply-bar">
        <input type="text" placeholder="Send message..." style="flex: 1; padding: 8px; border-radius: 20px; border: 1px solid #444; background: #000; color: #fff;">
        <button style="background: none; border: none; color: #fff;">❤️</button>
      </div>
    </div>
  </div>

  <script>
    // Navigation simulation logic
    function goToNextSegment() {
      var currentId = document.getElementById('story-viewer').getAttribute('data-current-id');
      if (currentId === '1001') {
        // Same user second segment -> Allowed
        history.pushState(null, '', '/stories/user_alpha/1002/');
        document.getElementById('story-viewer').setAttribute('data-current-id', '1002');
        document.getElementById('slide-content').innerHTML = '<h2>User Alpha - Slide 2 (Story #1002)</h2>';
      } else {
        // Attempt to auto-advance to NEXT USER (user_beta) -> Must be blocked by ZeroScroll
        history.pushState(null, '', '/stories/user_beta/2001/');
        document.getElementById('story-viewer').setAttribute('data-current-user', 'user_beta');
        document.getElementById('story-viewer').setAttribute('data-current-id', '2001');
        document.getElementById('slide-content').innerHTML = '<h2>User Beta - Slide 1 (Story #2001)</h2>';
      }
    }

    function goToPrevSegment() {
      history.pushState(null, '', '/stories/user_alpha/1001/');
      document.getElementById('story-viewer').setAttribute('data-current-id', '1001');
    }
  </script>
</body>
</html>
